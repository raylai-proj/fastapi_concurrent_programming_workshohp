name: CI

on:
  push:
    branches: [
      main,
      "feature/**"
    ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, and test health route
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: Set up uv
        uses: astral-sh/setup-uv@v10

      - name: install lock dependencies
        run: uv sync --locked --group dev

      - name: Check lint
        run: uv run ruff check .

      - name: Check format
        run: uv run ruff format --check .

      - name: Run test health route
        run: uv run pytest tests/test_health.py



