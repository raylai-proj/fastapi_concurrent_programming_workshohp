[project]
name = "fastapi-concurrent-programming-workshohp"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.146.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]